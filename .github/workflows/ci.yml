name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm i -g --force corepack@0.35.0 && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm i -g --force corepack@0.35.0 && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playground prepare
        run: npm run dev:prepare

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
