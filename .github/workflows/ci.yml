name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &pnpm
        uses: pnpm/action-setup@v6
      - &node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        if: github.ref_type != 'tag'
      - name: Validate release
        if: github.ref_type == 'tag'
        run: |
          pnpm release:check
          pnpm release:prepare
          pnpm docs:build

  release:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - *checkout
      - *pnpm
      - *node
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish GitHub release from the changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs --publish
